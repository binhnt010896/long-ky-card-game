name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the README and apps/game/pubspec.yaml.
  FLUTTER_VERSION: 3.47.7
  MELOS_VERSION: 8.9.0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: |
          dart pub global activate melos ${{ env.MELOS_VERSION }}
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze (zero warnings)
        run: melos run analyze

      - name: Test
        run: melos run test

      - name: Validate content
        run: |
          if [ -f packages/lk_content/bin/validate.dart ]; then
            dart run packages/lk_content/bin/validate.dart
          else
            echo "Content validator not present yet (T-11)."
          fi

      - name: Simulator smoke run
        # Invariant checks, then the win-rate gate of build-spec section 8:
        # the expert may not fall more than 10 points below its T-25 target.
        # (tools/sim/test/balance_test.dart checks every target exactly.)
        run: |
          if [ -d apps/game/assets/content/missions ]; then
            dart run tools/sim/bin/sim.dart --mission all --strategy expert --games 200 --seed 1 --json build/sim-smoke.json
            python3 - <<'PY'
          import json, sys
          targets = {'ch1_m1': 0.95, 'ch1_m2': 0.90, 'ch1_m3': 0.90, 'ch1_m4': 0.85, 'ch1_m5': 0.85}
          bad = []
          for r in json.load(open('build/sim-smoke.json'))['reports']:
              floor = targets.get(r['mission'], 0.0) - 0.10
              print(f"{r['mission']} expert win rate {r['winRate']:.3f} (floor {floor:.2f})")
              if r['winRate'] < floor:
                  bad.append(r['mission'])
          sys.exit(f"expert win rate below target minus 10 points: {bad}" if bad else 0)
          PY
          else
            echo "No mission content yet (T-12)."
          fi

      - name: Upload simulator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-smoke
          path: build/sim-smoke.json
          if-no-files-found: ignore
