name: long_ky_game
description: "Long Ký - The Game: a single-player, offline card strategy game about the Trần dynasty and the Mongol–Yuan invasions."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flame: 1.38.2
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  lk_content: any
  lk_rules: any
  path_provider: 2.1.6
  window_manager: 0.5.2
  flame_audio: 2.12.2
  app_links: 7.2.2
  url_launcher: 6.3.3
  qr_flutter: 4.1.0
  crypto: 3.0.7

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/content/maps/
    - assets/content/missions/
    # Painted art, by content id (build-spec section 6): cards/<id>.png and
    # officers|enemies/<id>/{portrait,card}.png. Missing art draws a placeholder.
    - assets/images/cards/
    - assets/images/enemies/ngot-luong-hop-thai/
    - assets/images/officers/le-phu-tran/
    - assets/images/officers/tran-khanh-du/
    - assets/images/officers/tran-nhat-hieu/
    - assets/images/officers/tran-quoc-tuan/
    - assets/images/officers/tran-thai-tong/
    - assets/images/officers/tran-thu-do/
    # Narration, music and effects, named by content id (build-spec section 6).
    # The files come with the audio production; until then they are skipped.
    - assets/audio/voice/
    - assets/audio/music/
    - assets/audio/effects/
    - assets/fonts/BeVietnamPro/OFL.txt
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Italic.ttf
          style: italic
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Bold.ttf
          weight: 700
